<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const P = new URLSearchParams(location.search);
const KIND = P.get("kind") ?? "vishuddhi";
const SIZE = Number(P.get("size") ?? 2000);
const TILT = Number(P.get("tilt") ?? -0.42);

const SPEC = {
  mooladhara: { hue: "#E8705A", petals: [{ n: 4, r0: 0.44, r1: 1.0, w: 1.0, off: 0.5 }], yantra: "square" },
  swadisthan: { hue: "#F2C94C", petals: [{ n: 6, r0: 0.46, r1: 1.0, w: 0.95 }, { n: 6, r0: 0.2, r1: 0.44, w: 0.9, off: 0.5, inner: true }], yantra: "star" },
  nabhi: { hue: "#4FB377", petals: [{ n: 10, r0: 0.5, r1: 1.0, w: 0.92 }], yantra: "triangle" },
  anahat: { hue: "#7E72D1", petals: [{ n: 12, r0: 0.5, r1: 1.0, w: 0.92 }], yantra: "star12" },
  vishuddhi: { hue: "#8EC5E8", petals: [{ n: 16, r0: 0.54, r1: 1.0, w: 0.92 }], yantra: "vishuddhi" },
  agnya: { hue: "#C9CED6", petals: [{ n: 2, r0: 0.3, r1: 1.0, w: 1.0, off: 0.5, agnya: true }], yantra: "agnya" },
  sahasrara: { hue: "#F4EDE4", petals: [{ n: 32, r0: 0.62, r1: 1.0, w: 1.1, lift: 0.1 }, { n: 24, r0: 0.56, r1: 0.88, w: 1.1, off: 0.5, lift: 0.22, z: 0.04 }, { n: 16, r0: 0.5, r1: 0.76, w: 1.1, lift: 0.3, z: 0.08 }], yantra: "sahasrara", iridescent: true },
};
const spec = SPEC[KIND];

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 50);
camera.position.set(0, 0, 6.2);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight("#fffaf2", "#3a3230", 0.35));
const key = new THREE.DirectionalLight("#fff6ea", 1.7); key.position.set(-3.2, 4.2, 5); scene.add(key);
const fill = new THREE.DirectionalLight("#e8f0ff", 0.45); fill.position.set(4, -1.5, 3); scene.add(fill);
const rim = new THREE.DirectionalLight("#ffffff", 1.2); rim.position.set(0.5, 3, -4); scene.add(rim);

// ── a sculpted, cupped lotus petal: lens-shaped solid, thin at its edges ──
function petalGeometry({ r0, r1, wMax, lift = 0.16, cup = 0.1, thick = 0.05, nu = 56, nv = 28 }) {
  const L = r1 - r0;
  const width = (u) => wMax * Math.pow(Math.sin(Math.PI * Math.pow(0.12 + 0.88 * u, 0.72)), 1.15);
  const pos = [], idx = [], col = [];
  const surf = (sign) => {
    const base = pos.length / 3;
    for (let i = 0; i <= nu; i++) {
      const u = i / nu, w = width(u);
      for (let j = 0; j <= nv; j++) {
        const v = (j / nv) * 2 - 1;
        const x = v * w, y = r0 + u * L;
        let z = lift * Math.pow(u, 1.5) + cup * v * v * (w / wMax) * Math.sin(Math.PI * Math.min(1, u * 1.15));
        z += 0.012 * Math.pow(1 - Math.abs(v), 4) * Math.sin(Math.PI * u); // soft midrib
        const t = thick * Math.sqrt(Math.max(0, 1 - v * v)) * (1 - 0.7 * u);
        pos.push(x, y, sign > 0 ? z + t * 0.5 : z - t * 0.5);
        const k = Math.pow(u, 0.9); const cc = BASE.clone().lerp(TIP, k); col.push(cc.r, cc.g, cc.b);
      }
    }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
      const a = base + i * (nv + 1) + j, b = a + 1, c = a + nv + 1, d = c + 1;
      if (sign > 0) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
    }
  };
  surf(1); surf(-1);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// rods for yantra lines: cylinders between points, spheres at joints
function rods(points, r, closed = true) {
  const parts = [];
  const n = closed ? points.length : points.length - 1;
  for (let i = 0; i < n; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    const len = a.distanceTo(b);
    const c = new THREE.CylinderGeometry(r, r, len, 20, 1, true);
    c.translate(0, len / 2, 0);
    const dir = b.clone().sub(a).normalize();
    c.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir));
    c.translate(a.x, a.y, a.z);
    parts.push(c);
    const s = new THREE.SphereGeometry(r, 20, 12); s.translate(a.x, a.y, a.z); parts.push(s);
  }
  return mergeGeometries(parts.map((p) => p.toNonIndexed()));
}
const poly = (n, r, rot, z) => Array.from({ length: n }, (_, k) => { const a = rot + (k / n) * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, z); });
const tri = (r, down, z) => poly(3, r, down ? -Math.PI / 2 : Math.PI / 2, z);
const ring = (r, tube) => new THREE.TorusGeometry(r, tube, 24, 160);

const hue = new THREE.Color(spec.hue);
const BASE = hue.clone().multiplyScalar(0.82);
const TIP = hue.clone().lerp(new THREE.Color('#ffffff'), KIND === 'sahasrara' ? 0.3 : 0.3);
const pearl = new THREE.Color('#ffffff');
const petalMat = new THREE.MeshPhysicalMaterial({
  color: pearl, roughness: 0.34, metalness: 0, sheen: 1, sheenRoughness: 0.45,
  sheenColor: hue.clone().lerp(new THREE.Color('#ffffff'), 0.7), clearcoat: 0.55, clearcoatRoughness: 0.22,
  iridescence: spec.iridescent ? 1 : 0.35, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 680],
  side: THREE.DoubleSide, vertexColors: true, emissive: hue, emissiveIntensity: 0.05,
});
const innerMat = petalMat.clone(); innerMat.color = new THREE.Color('#e9e2d8');
const gold = new THREE.MeshPhysicalMaterial({ color: "#d8b07a", metalness: 0.85, roughness: 0.26, clearcoat: 0.6, clearcoatRoughness: 0.2 });
const cream = new THREE.MeshPhysicalMaterial({ color: "#f6ecdb", roughness: 0.38, sheen: 0.8, sheenColor: new THREE.Color("#fff8ee"), clearcoat: 0.4 });
const plate = new THREE.MeshPhysicalMaterial({ color: hue.clone().multiplyScalar(KIND === "sahasrara" || KIND === "agnya" ? 0.86 : 0.55), roughness: 0.55, clearcoat: 0.35, clearcoatRoughness: 0.4 });
const bindu = new THREE.MeshStandardMaterial({ color: "#fff4e0", emissive: "#ffd9a0", emissiveIntensity: 1.6 });

const group = new THREE.Group();
group.rotation.x = TILT;
scene.add(group);

for (const row of spec.petals) {
  const half = Math.PI / row.n;
  const wMax = row.agnya ? 0.4 : Math.min(0.42, Math.sin(half) * row.r1 * row.w * 0.84);
  const g = petalGeometry({ r0: row.r0, r1: row.r1, wMax, lift: row.lift ?? (row.inner ? 0.08 : 0.16), cup: row.inner ? 0.04 : 0.06, thick: row.n > 20 ? 0.03 : 0.05 });
  for (let i = 0; i < row.n; i++) {
    const m = new THREE.Mesh(g, row.inner ? innerMat : petalMat);
    m.rotation.z = ((i + (row.off ?? 0)) / row.n) * Math.PI * 2;
    m.position.z = (row.inner ? 0.06 : -0.02) + (i % 2) * 0.02 + (row.z ?? 0);
    group.add(m);
  }
}

const rIn = spec.petals[0].r0 + 0.02;
const add = (geo, mat, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.z = z; group.add(m); return m; };
add(new THREE.CylinderGeometry(rIn, rIn, 0.04, 128).rotateX(Math.PI / 2), plate, 0.0);
add(ring(rIn, 0.022), gold, 0.03);
const Z = 0.06, T = 0.012;
switch (spec.yantra) {
  case "square": add(rods(poly(4, rIn * 0.72 * Math.SQRT2, Math.PI / 4, Z), T), gold); add(rods(tri(rIn * 0.6, true, Z + 0.01), T), gold); break;
  case "star": add(rods(tri(rIn * 0.5, false, Z), T), gold); add(rods(tri(rIn * 0.5, true, Z), T), gold); break;
  case "star12": add(rods(tri(rIn * 0.86, false, Z), T), gold); add(rods(tri(rIn * 0.86, true, Z), T), gold); break;
  case "triangle": add(ring(rIn * 0.85, 0.008), gold, Z); add(rods(tri(rIn * 0.78, true, Z), T), gold); break;
  case "vishuddhi": add(rods(tri(rIn * 0.92, true, Z), T), gold); add(new THREE.CylinderGeometry(rIn * 0.3, rIn * 0.3, 0.02, 96).rotateX(Math.PI / 2), cream, Z); add(ring(rIn * 0.3, 0.009), gold, Z + 0.012); break;
  case "agnya": add(ring(rIn * 0.75, 0.012), gold, Z); break;
  case "sahasrara": for (const [r, d] of [[0.88, false], [0.88, true], [0.62, false], [0.62, true], [0.36, true]]) add(rods(tri(rIn * r, !d, Z), T * 0.85), gold); break;
}
add(new THREE.SphereGeometry(KIND === "vishuddhi" ? 0.07 : 0.05, 32, 16), bindu, Z + 0.06);
const glow = new THREE.PointLight("#ffe2b8", 1.4, 2.2, 1.6); glow.position.set(0, 0, 0.5); group.add(glow);

// fit: scale so the form fills ~86% of the frame
group.scale.setScalar(KIND === "agnya" ? 1.0 : 0.98);
renderer.render(scene, camera);
window.__done = renderer.domElement.toDataURL("image/png");
</script>
</body></html>
